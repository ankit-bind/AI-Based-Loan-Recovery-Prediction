# ============================================================
# LOAN RECOVERY PROJECT — MODEL PARAMETERS
# ============================================================

# ── DATA SAMPLING ───────────────────────────────────────────
data:
  n_samples: 307511
  random_state: 42
  test_size: 0.2
  stratify: true
  chunk_size: 200000

# ── SMOTE ───────────────────────────────────────────────────
smote:
  random_state: 42
  k_neighbors: 5
  sampling_strategy: 0.3

# ── CROSS VALIDATION ────────────────────────────────────────
cross_validation:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "roc_auc"

# ── THRESHOLD ───────────────────────────────────────────────
threshold:
  default: 0.5
  high_recovery: 0.70
  medium_recovery: 0.40
  optimize_metric: "f1"

# ── LOGISTIC REGRESSION ─────────────────────────────────────
logistic_regression:
  C: 1.0
  max_iter: 1000
  class_weight: "balanced"
  random_state: 42
  solver: "lbfgs"

# ── RANDOM FOREST ───────────────────────────────────────────
random_forest:
  n_estimators: 200
  max_depth: 15
  min_samples_leaf: 2
  class_weight: "balanced"
  random_state: 42
  n_jobs: -1

# ── LIGHTGBM ────────────────────────────────────────────────
lightgbm:
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 10
  num_leaves: 31
  subsample: 0.8
  colsample_bytree: 0.8
  class_weight: "balanced"
  random_state: 42
  n_jobs: -1
  verbose: -1

# ── XGBOOST ─────────────────────────────────────────────────
xgboost:
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 11
  random_state: 42
  eval_metric: "logloss"
  n_jobs: -1

# ── HYPERPARAMETER SEARCH ───────────────────────────────────
hyperparameter_search:
  n_iter: 10
  scoring: "roc_auc"
  cv: 5
  verbose: 1
  random_state: 42
  n_jobs: -1

  lightgbm_grid:
    model__n_estimators: [100, 200, 300]
    model__learning_rate: [0.01, 0.05, 0.1]
    model__max_depth: [5, 10, 15]
    model__num_leaves: [20, 31, 50]
    model__subsample: [0.8, 1.0]
    model__colsample_bytree: [0.8, 1.0]

  xgboost_grid:
    model__n_estimators: [100, 200]
    model__learning_rate: [0.05, 0.1]
    model__max_depth: [5, 10]
    model__subsample: [0.8]
    model__colsample_bytree: [0.8]

# ── EVALUATION METRICS ──────────────────────────────────────
evaluation:
  primary_metric: "roc_auc"
  secondary_metric: "recall"
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
